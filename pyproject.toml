[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "classifier-pytorch"
version = "0.1.0"
description = "A simple feed-forward neural network (FFNN) built with PyTorch to recognise handwritten digits"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["torch>=2.14,<3", "torchvision>=0.29,<1", "safetensors>=0.8,<1", "matplotlib"]

[project.optional-dependencies]
web = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pillow>=10"]

[project.scripts]
classifier = "classifier_pytorch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
